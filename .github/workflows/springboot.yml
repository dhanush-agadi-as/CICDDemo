name: spring boot app 1
on:
    push

jobs:
    build-test:
        runs-on: ubuntu-latest

        steps:
            - name: Check Out
              uses: actions/checkout@v4

            - name: Setup jdk
              uses: actions/setup-java@v5
              with:
               distribution: 'temurin'
               java-version: '21'
                

            - name: build and test (maven)
              working-directory: springboot/hello-spring
              run: mvn -B clean verify

            - name: upload test report
              uses: actions/upload-artifact@v7
              with:
                name: test-repports
                path: springboot/hello-spring/target/surefire-reports

    docker-build-push:
        runs-on: ubuntu-latest
        needs: build-test

        steps:
            - name: Check Out
              uses: actions/checkout@v4

            - name: Setup jdk
              uses: actions/setup-java@v5
              with:
               distribution: 'temurin'
               java-version: '21'
            
            - name: Build the JAR for docker
              working-directory: springboot/hello-spring
              run: mvn -B clean package -DskipTests
 

            - name: Login to the docker hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}


            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                context: springboot/hello-spring
                push: true
                tags: |
                      ${{ secrets.DOCKER_USERNAME }}/hello-spring:latest
                      ${{ secrets.DOCKER_USERNAME }}/hello-spring:${{ github.sha }}
                      ${{ secrets.DOCKER_USERNAME }}/hello-spring:${{ github.ref_name }}
